<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows And Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 15px 5px #70a711;
        }

        .text-element{
            text-shadow: 8px 8px 7px #7a1f1f;
        }

    </style>
</head>
<body>
    <div class="box">
        Iam a box
    </div>

    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloremque excepturi dolor officiis asperiores ex? Suscipit voluptates dicta optio mollitia. Cum illo harum aperiam, pariatur accusantium itaque tenetur inventore eaque consectetur, doloribus, eos ea qui?
    </p>
</body>
</html>
